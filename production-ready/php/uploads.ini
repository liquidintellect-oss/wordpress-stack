; ── Execution & memory limits ────────────────────────────────────────────────
; Upload size limits (upload_max_filesize / post_max_size) are controlled by
; the WP_MAX_UPLOAD and WP_MAX_FILESIZE build args in docker/Dockerfile.
max_execution_time  = 300
max_input_time      = 300
memory_limit        = 256M
