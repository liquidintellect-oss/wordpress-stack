; ── OPcache — cache compiled PHP bytecode in memory ─────────────────────────
[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.revalidate_freq=0        ; never re-check files in production (set to 2 in dev)
opcache.validate_timestamps=0    ; set to 1 in dev so changes take effect immediately
opcache.fast_shutdown=1
opcache.save_comments=1          ; required by some WP plugins
