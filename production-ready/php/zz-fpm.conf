; ── PHP-FPM global settings ───────────────────────────────────────────────────
; CRITICAL: daemonize = no keeps PHP-FPM in the foreground so Docker sees a
; live PID 1. Without this the master process forks to the background and the
; container exits immediately with code 0.
[global]
daemonize               = no

; ── PHP-FPM pool tuning ──────────────────────────────────────────────────────
; Overrides the default www pool settings from the base image.
;
; pm = dynamic: scales workers based on load
; Tune max_children based on available RAM:
;   max_children ≈ (Total RAM for PHP) / (avg worker RAM ~30–50MB)
;   e.g. 1GB → ~20 workers

[www]
pm                      = dynamic
pm.max_children         = 20
pm.start_servers        = 5
pm.min_spare_servers    = 5
pm.max_spare_servers    = 10
pm.max_requests         = 500      ; recycle workers to prevent memory leaks

; Log slow requests (>5s) — helpful for identifying bottlenecks
slowlog                 = /proc/self/fd/2
request_slowlog_timeout = 5s

; Pass real IP through to WordPress
clear_env               = no
